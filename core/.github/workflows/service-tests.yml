name: Service Health & Integration Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: learning
          POSTGRES_USER: ensemble
          POSTGRES_PASSWORD: ensemble-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ensemble -d learning"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov

      - name: Install JavaScript dependencies from lockfile
        run: npm ci

      - name: Run JavaScript tests
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: learning
          PGUSER: ensemble
          PGPASSWORD: ensemble-test
        run: npm test

      - name: Run JavaScript syntax checks
        run: npm run lint

      - name: Run reviewer MCP contract and HTTP tests
        run: python -m unittest discover -s reviewer-mcp -p 'test_*.py' -v

      - name: Run Code Search MCP contract tests
        run: python -m unittest discover -s code-search-mcp -p 'test_*.py' -v

      - name: Run gateway REST integration tests
        run: python server/test_ensemble_server.py

      - name: Run gateway HTTP representation contract tests
        run: python -m pytest server/test_http_contract.py -q

      - name: Run service unit and integration tests
        run: |
          python -m pytest \
            execution/test_execution.py \
            arbitration/test_orchestrator.py \
            collaboration/test_orchestrator.py \
            providers/test_claude_code.py \
            providers/test_registry.py \
            memory-service/test_memory_service.py \
            alert_service/test_alert_service.py \
            graph-service/test_graph_service.py \
            session-messaging/test_messenger.py \
            learning-service/test_operational_memory_contract.py \
            learning-service/test_learning_retry_contract.py \
            learning-service/test_ga_artifact_contract.py \
            ga_tuning/test_learning_artifact.py \
            test/test_architecture_integration.py \
            test/test_end_to_end_execution.py \
            shared/test_operational_memory_endpoint.py \
            test_decision_provenance_immutability.py \
            -v

      - name: Run hook lifecycle contract tests
        run: python -m unittest -v test_hook_lifecycle_contract

      - name: Run Thompson Service tests
        run: |
          cd thompson-service
          python test_thompson_service.py
          cd ..

      - name: Run Learning Service tests
        run: python learning-service/test_learning_service.py

      - name: Run service-unavailable client contract tests
        run: python test/test_service_unavailable_behavior.py

      - name: Run service lifecycle ownership contract
        run: python test/test_service_lifecycle.py

      - name: Run installer/template consistency checks
        run: python test/test_service_installers.py

      - name: Run isolated top-level installer end-to-end test
        run: python test/test_top_level_install.py

      - name: Run isolated full-stack acceptance test
        shell: bash
        run: bash scripts/test-isolated-stack.sh

      - name: Check tracked runtime artifacts
        shell: bash
        run: |
          set -euo pipefail

          if git ls-files -z -- \
            '*.pyc' '*.pyo' '__pycache__/*' \
            '*.log' '*.output' \
            'alerts/*' 'caching/test_results/*' \
            'ga_tuning/results/*' 'learning/autonomous_outcomes/*' \
            'learning/post_task_outcomes/*' 'results/*' |
            grep -zq .; then
            echo "Tracked runtime/generated artifacts found:"
            git ls-files -z -- \
              '*.pyc' '*.pyo' '__pycache__/*' \
              '*.log' '*.output' \
              'alerts/*' 'caching/test_results/*' \
              'ga_tuning/results/*' 'learning/autonomous_outcomes/*' \
              'learning/post_task_outcomes/*' 'results/*' |
              while IFS= read -r -d '' path; do
                printf '%s\\n' "$path"
              done
            exit 1
          fi

          echo "PASS: no tracked runtime or Python bytecode artifacts"

      - name: Check Python syntax
        run: |
          python -m compileall -q \
            arbitration \
            graph-service \
            learning \
            learning-service \
            memory-service \
            shared \
            thompson-service

      - name: Verify required service templates and installers
        shell: bash
        run: |
          set -euo pipefail
          services=(
            "memory-service/claude-memory.service.template"
            "thompson-service/claude-thompson.service.template"
            "learning-service/claude-learning.service.template"
            "graph-service/claude-graph.service.template"
            "server/claude-ensemble.service.template"
          )

          for template in "${services[@]}"; do
            test -f "$template"
            echo "Found $template"
          done

          for script in \
            memory-service/install.sh \
            thompson-service/install.sh \
            learning-service/install.sh \
            graph-service/install.sh \
            server/install.sh; do
            test -x "$script"
            echo "Executable $script"
          done

      - name: Verify meta-review entrypoints are portable symlinks
        shell: bash
        run: |
          set -euo pipefail
          entries=(
            "tools/meta-review"
            "tools/meta-meta-review"
            "tools/meta-meta-meta-review"
            "tools/meta-meta-meta-meta-review"
          )
          for entry in "${entries[@]}"; do
            test -L "$entry" || { echo "FAIL: expected symlink: $entry" >&2; exit 1; }
            target="$(readlink "$entry")"
            [[ -n "$target" && "$target" != /* ]] || {
              echo "FAIL: symlink target must be repository-relative: $entry -> $target" >&2
              exit 1
            }
            test -e "$(dirname "$entry")/$target" || {
              echo "FAIL: symlink target does not exist: $entry -> $target" >&2
              exit 1
            }
          done
          echo "PASS: meta-review entrypoints are relative symlinks with existing targets"

      - name: Verify root installer does not install Claude
        shell: bash
        run: |
          set -euo pipefail

          # The root installer configures Claude Ensemble; it must not install
          # the Claude CLI itself. Only inspect executable package-manager
          # commands, not comments or documentation.
          executable_content=$(sed '/^[[:space:]]*#/d' install.sh)

          if printf '%s\\n' "$executable_content" |
            grep -Eiq '^[[:space:]]*(npm|brew|apt|apt-get|dnf|pip|pip3)[[:space:]].*(install|add)[[:space:]].*(claude|@anthropic-ai/claude-code)([[:space:]]|$)'; then
            echo "Root installer appears to install Claude itself"
            exit 1
          fi

          grep -q 'Claude Ensemble Toolkit Installer' install.sh
          echo "PASS: root installer is scoped to Claude Ensemble"


  lint-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.sh' -not -path './.git/*' -print0 |
            xargs -0 -n1 bash -n

      - name: Run versioned deployment contract tests
        shell: bash
        run: |
          bash tests/test_ce_deployment.sh
          bash tests/test_versioned_staging_only.sh
          bash tests/test_backup_ce_state.sh
          bash tests/test_create_ce_release_tag.sh
          bash tests/test_select_ce_release_version.sh

  docs-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify documentation exists
        run: |
          set -euo pipefail
          required_docs=(
            "SERVICES_GUIDE.md"
            "README.md"
            "memory-service/README.md"
            "thompson-service/README.md"
            "learning-service/README.md"
            "alert_service/README.md"
            "session-messaging/README.md"
          )

          for doc in "${required_docs[@]}"; do
            test -f "$doc"
            echo "Found $doc"
          done
