name: GA Tuning Contract Tests

on:
  pull_request:
    paths:
      - "ga_tuning/**"
      - "tools/ga-tuning-schedule.sh"
      - ".github/workflows/ga-tuning-tests.yml"
  push:
    branches:
      - main
    paths:
      - "ga_tuning/**"
      - "tools/ga-tuning-schedule.sh"
      - ".github/workflows/ga-tuning-tests.yml"

jobs:
  ga-tuning-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run GA tuning contract tests
        run: python -m unittest ga_tuning.test_scheduler_contract ga_tuning.test_parameter_schema ga_tuning.test_learning_artifact ga_tuning.test_pending_recovery
      - name: Test Learning service negative acknowledgement logging
        run: python learning-service/test_learning_response_logging.py
      - name: Check scheduler shell syntax
        run: bash -n tools/ga-tuning-schedule.sh
