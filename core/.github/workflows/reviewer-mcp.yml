name: Reviewer MCP Tests

on:
  pull_request:
    paths:
      - "reviewer-mcp/**"
      - "collaboration/**"
      - "server/ensemble_server.py"

jobs:
  reviewer-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run reviewer MCP tests
        run: python -m unittest discover -s reviewer-mcp -p "test_*.py" -v
      - name: Compile collaboration and server code
        run: python -m compileall -q collaboration server
      - name: Install collaboration test dependency
        run: python -m pip install pytest
      - name: Run collaboration tests
        run: python -m pytest -q collaboration/test_orchestrator.py
