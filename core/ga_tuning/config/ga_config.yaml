# Genetic Algorithm Tuning Configuration
# Parameters for evolving 5 RH tool systems

# GA Meta-parameters
population_size: 50
generations: 25
crossover_rate: 0.8
mutation_rate: 0.1
tournament_k: 3
# Set an integer to reproduce a run; omitted/null generates a fresh seed each run.
seed: null
max_workers: 4
output_dir: './results'

# System-specific parameter ranges
systems:
  compression:
    compression_level:
      min: 0.0
      max: 5.0
      description: "How aggressively to compress (0=none, 5=max)"
    target_reduction:
      min: 0.2
      max: 0.7
      description: "Target token reduction percentage"
    fitness_targets:
      semantic_similarity: 0.85
      description: "Minimum semantic similarity to preserve meaning"

  thompson:
    alpha_prior:
      min: 0.5
      max: 3.0
      description: "Beta distribution alpha (success belief)"
    beta_prior:
      min: 0.5
      max: 3.0
      description: "Beta distribution beta (failure belief)"
    cost_weight:
      min: 0.1
      max: 0.5
      description: "Weight given to cost vs quality"
    fitness_targets:
      quality_maintained: 0.90
      description: "Minimum quality maintenance threshold"

  caching:
    ttl_seconds:
      min: 60.0
      max: 600.0
      description: "Time-to-live for cache entries"
    cache_threshold:
      min: 0.1
      max: 0.9
      description: "Minimum token count to cache"
    fitness_targets:
      false_negative_rate: 0.05
      description: "Maximum acceptable false negative rate"

  matrix:
    domain_weight:
      min: 0.1
      max: 0.5
      description: "Weight for domain expertise"
    complexity_weight:
      min: 0.2
      max: 0.6
      description: "Weight for task complexity"
    task_weight:
      min: 0.1
      max: 0.5
      description: "Weight for task type"
    fitness_targets:
      routing_accuracy: 0.92
      description: "Target routing accuracy threshold"

  dashboard:
    learning_rate:
      min: 0.01
      max: 0.2
      description: "Speed of parameter updates"
    exploration_decay:
      min: 0.85
      max: 0.99
      description: "How fast exploration decays"
    alert_threshold:
      min: 0.3
      max: 0.9
      description: "When to alert on anomalies"
    fitness_targets:
      learning_speed: 0.20
      quality_regression: 0.05
      description: "20%+ learning speed, <5% regression"
