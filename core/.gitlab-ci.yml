.default_rules: &default_rules
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

.node_cache: &node_cache
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
    policy: pull

.node_image: &node_image
  image: node:22

stages:
  - deps
  - test
  - quality

install:
  stage: deps
  <<: *node_image
  script:
    - npm ci
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
    policy: push
  <<: *default_rules

test:
  stage: test
  <<: *node_image
  <<: *node_cache
  script:
    - npm test
  <<: *default_rules

test-postgres-integration:
  stage: test
  <<: *node_image
  <<: *node_cache
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_DB: learning
    POSTGRES_USER: ensemble
    POSTGRES_PASSWORD: ensemble-test
    PGHOST: postgres
    PGPORT: "5432"
    PGDATABASE: learning
    PGUSER: ensemble
    PGPASSWORD: ensemble-test
  script:
    - npm run test:integration:postgres
  <<: *default_rules

# Syntax lint for all tracked JavaScript modules. This is a required gate.
lint:
  stage: quality
  <<: *node_image
  <<: *node_cache
  script:
    - npm run lint
  <<: *default_rules

# Security audit is a required gate.
security:
  stage: quality
  <<: *node_image
  <<: *node_cache
  script:
    - npm audit --audit-level=high
  <<: *default_rules
