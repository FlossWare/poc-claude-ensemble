name: POC Service Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "services/memory/**"
      - "services/server/**"
      - "services/collaboration/**"
      - "services/ingestion/**"
      - "services/shared/**"
      - "core/**"
      - "scripts/**"
      - "core/**"
      - "scripts/**"
      - ".github/workflows/session-ledger-tests.yml"
  push:
    branches: [main, feature/ledger-pull-parity]
    paths:
      - "services/memory/**"
      - "services/server/**"
      - "services/collaboration/**"
      - "services/ingestion/**"
      - "services/shared/**"
      - ".github/workflows/session-ledger-tests.yml"

permissions:
  contents: read

jobs:
  session-ledger-rest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install -r requirements-dev.txt
      - name: Test session history REST API
        env:
          PYTHONPATH: services
          POC_CLAUDE_ENSEMBLE_LEDGER_ROOT: ${{ runner.temp }}/ledger
          POC_CLAUDE_ENSEMBLE_MEMORY_DIR: ${{ runner.temp }}/memory
          POC_CLAUDE_ENSEMBLE_LOG_DIR: ${{ runner.temp }}/logs
          POC_CLAUDE_ENSEMBLE_RUNTIME_DIR: ${{ runner.temp }}/runtime
        run: python -m pytest services/memory/test_memory_service.py -k history -q
      - name: Test append-only ledger contract
        env:
          PYTHONPATH: services
          POC_CLAUDE_ENSEMBLE_LEDGER_ROOT: ${{ runner.temp }}/ledger
        run: python -m pytest services/memory/test_append_only_ledger.py services/memory/test_ledger_http_transfer.py -q


  poc-ingestion-interactions:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate ingestion service installer syntax
        run: bash -n services/server/install.sh
      - name: Test ingestion source resolution, indexing, and deployment
        run: python -m unittest discover -s services/ingestion -p "test_*.py" -v
      - name: Test collaboration interaction events
        run: python -m unittest discover -s services/collaboration -p "test_interaction_events.py" -v
      - name: Test interaction and ingestion gateway routes
        run: |
          python -m unittest discover -s services/server -p "test_interaction_routes.py" -v
          python -m unittest discover -s services/server -p "test_ingestion_routes.py" -v
      - name: Test append-only interaction ledger writer
        run: python -m unittest discover -s services/shared -p "test_operational_memory.py" -v

  operational-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test operational dashboard
        run: python -m unittest discover -s services/server -p "test_operational_dashboard.py" -v

  core-service-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify compatibility mirror matches canonical services
        run: python scripts/check-core-service-sync.py

  core-compatibility-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: core:services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned dependencies and test runner
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run core compatibility tests
        run: python -m pytest core -q
