name: POC Service Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "services/**"
      - "requirements*.txt"
      - ".github/workflows/session-ledger-tests.yml"
  push:
    branches: [main, feature/ledger-pull-parity]
    paths:
      - "services/**"
      - "requirements*.txt"
      - ".github/workflows/session-ledger-tests.yml"

permissions:
  contents: read

jobs:
  session-ledger-rest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install -r requirements-dev.txt
      - name: Test session history REST API
        env:
          PYTHONPATH: services
          POC_CLAUDE_ENSEMBLE_LEDGER_ROOT: ${{ runner.temp }}/ledger
          POC_CLAUDE_ENSEMBLE_MEMORY_DIR: ${{ runner.temp }}/memory
          POC_CLAUDE_ENSEMBLE_LOG_DIR: ${{ runner.temp }}/logs
          POC_CLAUDE_ENSEMBLE_RUNTIME_DIR: ${{ runner.temp }}/runtime
        run: python -m pytest services/memory/test_memory_service.py -k history -q
      - name: Test append-only ledger contract
        env:
          PYTHONPATH: services
          POC_CLAUDE_ENSEMBLE_LEDGER_ROOT: ${{ runner.temp }}/ledger
        run: python -m pytest services/memory/test_append_only_ledger.py services/memory/test_ledger_http_transfer.py -q


  poc-ingestion-interactions:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate ingestion service installer syntax
        run: bash -n services/server/install.sh
      - name: Test ingestion source resolution, indexing, and deployment
        run: python -m unittest discover -s services/ingestion -p "test_*.py" -v
      - name: Test collaboration interaction events
        run: python -m unittest discover -s services/collaboration -p "test_interaction_events.py" -v
      - name: Test interaction and ingestion gateway routes
        run: |
          python -m unittest discover -s services/server -p "test_interaction_routes.py" -v
          python -m unittest discover -s services/server -p "test_ingestion_routes.py" -v
      - name: Test append-only interaction ledger writer
        run: python -m unittest discover -s services/shared -p "test_operational_memory.py" -v

  operational-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test operational dashboard
        run: python -m unittest discover -s services/server -p "test_operational_dashboard.py" -v

  full-service-suite:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install POC service dependencies and test runner
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Run every POC service test
        run: |
          python -m pytest services -q --junitxml="$RUNNER_TEMP/service-tests.xml"
      - name: Publish test and skip counts
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path(os.environ["RUNNER_TEMP"]) / "service-tests.xml"
          if not report.exists():
              summary = "## POC service test results\n\nJUnit report was not produced."
          else:
              root = ET.parse(report).getroot()
              suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
              tests = sum(int(suite.attrib.get("tests", 0)) for suite in suites)
              failures = sum(int(suite.attrib.get("failures", 0)) for suite in suites)
              errors = sum(int(suite.attrib.get("errors", 0)) for suite in suites)
              skipped = sum(int(suite.attrib.get("skipped", 0)) for suite in suites)
              passed = tests - failures - errors - skipped
              summary = (
                  "## POC service test results\n\n"
                  f"- Tests: **{tests}**\n"
                  f"- Passed: **{passed}**\n"
                  f"- Skipped: **{skipped}**\n"
                  f"- Failures: **{failures}**\n"
                  f"- Errors: **{errors}**\n"
              )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(summary)
          PY
