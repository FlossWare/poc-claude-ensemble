name: Operational Dashboard Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "services/server/**"
      - ".github/workflows/operational-dashboard-tests.yml"
  push:
    branches: [main]
    paths:
      - "services/server/**"
      - ".github/workflows/operational-dashboard-tests.yml"

permissions:
  contents: read

jobs:
  operational-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test operational dashboard
        run: python -m unittest discover -s services/server -p "test_operational_dashboard.py" -v
