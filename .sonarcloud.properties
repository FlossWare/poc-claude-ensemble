# SonarQube Cloud automatic analysis configuration.
# `core/` mirrors canonical `services/` implementations for compatibility and
# is kept in sync by scripts/check-core-service-sync.py and CI. Measuring those
# intentional copies as duplication obscures actionable duplication in the
# canonical implementation. Keep `core/` in all other analysis, including
# security and reliability rules.
sonar.cpd.exclusions=core/**
